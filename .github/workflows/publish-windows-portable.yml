name: Publish Workforce360 portable Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Assemble portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360'
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $backendSource = Join-Path $PWD 'backend'
          Get-ChildItem -LiteralPath $backendSource -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](__pycache__|tests?)[\\/]' -and $_.Extension -ne '.pyc' } |
            ForEach-Object {
              $relative = $_.FullName.Substring($backendSource.Length).TrimStart('\')
              $destination = Join-Path (Join-Path $package 'backend') $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination
            }
          $assetsPackage = Join-Path $package 'assets'
          New-Item -ItemType Directory -Force -Path $assetsPackage | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'assets\abb-logo.svg') -Destination (Join-Path $assetsPackage 'abb-logo.svg')
          $frontendPackage = Join-Path $package 'frontend'
          New-Item -ItemType Directory -Force -Path $frontendPackage | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'frontend\dist') -Destination $frontendPackage -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'packaging') | Out-Null
          Copy-Item -LiteralPath 'packaging\run_portable.py' -Destination (Join-Path $package 'packaging\run_portable.py')
          Copy-Item -LiteralPath 'packaging\run_portable.bat' -Destination (Join-Path $package 'run_app.bat')

          $pythonVersion = python -c 'import platform; print(platform.python_version())'
          $pythonMinor = (python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")').Trim()
          $embedArchive = "python-$pythonVersion-embed-amd64.zip"
          $embedUrl = "https://www.python.org/ftp/python/$pythonVersion/$embedArchive"
          $embedZip = Join-Path $env:RUNNER_TEMP $embedArchive
          $runtime = Join-Path $package 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $embedUrl -OutFile $embedZip
          Expand-Archive -LiteralPath $embedZip -DestinationPath $runtime
          Remove-Item -LiteralPath $embedZip -Force
          $pthFile = Join-Path $runtime "python$pythonMinor._pth"
          if (-not (Test-Path -LiteralPath $pthFile)) { throw "Embedded Python path file is missing: $pthFile" }
          @("python$pythonMinor.zip", '.', '..', 'Lib\site-packages', 'import site') | Set-Content -LiteralPath $pthFile -Encoding ascii
          $sitePackages = Join-Path $runtime 'Lib\site-packages'
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          python -m pip install --disable-pip-version-check --no-compile --target $sitePackages -r requirements-portable.txt

          $portablePython = Join-Path $runtime 'python.exe'
          if (-not (Test-Path -LiteralPath $portablePython)) { throw 'The bundled Python executable is missing.' }
          Push-Location $package
          try {
            & $portablePython -c 'import backend.main, fastapi, uvicorn, sqlalchemy, PIL, reportlab, cryptography, argon2; from svglib.svglib import svg2rlg; print("Portable application imports successfully")'
            if ($LASTEXITCODE -ne 0) { throw 'The packaged Python runtime could not import required backend dependencies.' }
          }
          finally { Pop-Location }
          if (-not (Test-Path -LiteralPath (Join-Path $package 'frontend\dist\index.html'))) { throw 'The production frontend build is missing.' }

          New-Item -ItemType Directory -Force -Path (Join-Path $package 'data\uploads\workers'), (Join-Path $package 'data\uploads\visitors') | Out-Null
          @'
          ABB Workforce360 - Portable Windows Release

          1. Extract the complete ZIP into a writable local folder.
          2. Double-click run_app.bat.
          3. Keep the console open. Close the browser and press Enter in the console to stop the backend cleanly.

          This package includes its Python runtime, backend dependencies, and production React frontend. Python and Node.js do not need to be installed on the user computer.
          The first launch creates local secrets in .env. Do not share that file. Create an administrator from this folder with:
            runtime\python.exe -m backend.create_admin
          SQLite records and uploaded images are stored under data\. Back up data\ and .env together before moving the portable folder. Neither is included in the release ZIP.
          The launcher binds to the network interfaces on port 8000. For other laptops on the same LAN, use the URL printed in the console and allow inbound TCP 8000 on the Windows Private firewall profile if needed.
          '@ | Set-Content -LiteralPath (Join-Path $package 'PORTABLE_README.txt') -Encoding utf8

          $archive = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360_Portable_Windows.zip'
          Compress-Archive -Path $package -DestinationPath $archive -CompressionLevel Optimal

      - name: Smoke-check packaged health endpoint and frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360'
          $python = Join-Path $root 'runtime\python.exe'
          $port = 18193
          $healthUrl = "http://127.0.0.1:$port/api/health"
          $pageUrl = "http://127.0.0.1:$port/"
          $env:WIR_SESSION_SECRET = 'ci-session-secret-32-bytes-minimum-plus'
          $env:WIR_CSRF_SECRET = 'ci-csrf-secret-32-bytes-minimum-plus'
          $env:WIR_WORKER_ID_SECRET = 'ci-worker-id-secret-32-bytes-minimum-plus'
          $env:WIR_AADHAAR_ENCRYPTION_KEY = 'MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
          $env:WIR_ALLOWED_ORIGIN = $pageUrl.TrimEnd('/')
          $stdout = Join-Path $env:RUNNER_TEMP 'workforce360-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'workforce360-smoke.error.log'
          $process = $null
          Push-Location $root
          try {
            $process = Start-Process -FilePath $python -ArgumentList @('-m', 'uvicorn', 'backend.main:app', '--host', '127.0.0.1', '--port', [string]$port, '--no-access-log') -WorkingDirectory $root -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { break }
              try {
                $health = Invoke-RestMethod -Uri $healthUrl -TimeoutSec 2
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) {
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw 'Packaged Workforce360 /api/health did not return status=ok.'
            }
            $page = Invoke-WebRequest -UseBasicParsing -Uri $pageUrl -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<title>ABB Workforce360</title>') { throw 'Packaged Workforce360 main page failed its HTTP/title check.' }
            Write-Host 'Packaged backend health and frontend page both returned successfully.'
          }
          finally {
            if ($process) {
              $process.Refresh()
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; $process.WaitForExit(10000) }
            }
            Pop-Location
            Remove-Item Env:WIR_SESSION_SECRET, Env:WIR_CSRF_SECRET, Env:WIR_WORKER_ID_SECRET, Env:WIR_AADHAAR_ENCRYPTION_KEY, Env:WIR_ALLOWED_ORIGIN -ErrorAction SilentlyContinue
          }

      - name: Attach the portable ZIP to this Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ runner.temp }}/ABB_Workforce360_Portable_Windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
