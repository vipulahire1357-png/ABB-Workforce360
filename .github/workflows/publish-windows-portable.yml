name: Publish Workforce360 portable Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install source smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Test reserved ports and project-scoped locks
        run: python -m pytest tests/test_launcher_runtime.py

      - name: Assemble portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360'
          if (Test-Path -LiteralPath $package) { Remove-Item -LiteralPath $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          $backendSource = Join-Path $PWD 'backend'
          Get-ChildItem -LiteralPath $backendSource -File -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](__pycache__|tests?)[\\/]' -and
              $_.Extension -ne '.pyc' -and $_.Name -ne 'dev_server.py'
            } |
            ForEach-Object {
              $relative = $_.FullName.Substring($backendSource.Length).TrimStart('\')
              $destination = Join-Path (Join-Path $package 'backend') $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $destination
            }

          $assetsPackage = Join-Path $package 'assets'
          New-Item -ItemType Directory -Force -Path $assetsPackage | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'assets\abb-logo.svg') -Destination (Join-Path $assetsPackage 'abb-logo.svg')
          $frontendPackage = Join-Path $package 'frontend'
          New-Item -ItemType Directory -Force -Path $frontendPackage | Out-Null
          Copy-Item -LiteralPath (Join-Path $PWD 'frontend\dist') -Destination $frontendPackage -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'packaging') | Out-Null
          Copy-Item -LiteralPath 'packaging\run_portable.py' -Destination (Join-Path $package 'packaging\run_portable.py')
          Copy-Item -LiteralPath 'packaging\run_portable.bat' -Destination (Join-Path $package 'run_app.bat')

          $pythonVersion = python -c 'import platform; print(platform.python_version())'
          $pythonMinor = (python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")').Trim()
          $embedArchive = "python-$pythonVersion-embed-amd64.zip"
          $embedUrl = "https://www.python.org/ftp/python/$pythonVersion/$embedArchive"
          $embedZip = Join-Path $env:RUNNER_TEMP $embedArchive
          $runtime = Join-Path $package 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri $embedUrl -OutFile $embedZip
          Expand-Archive -LiteralPath $embedZip -DestinationPath $runtime
          Remove-Item -LiteralPath $embedZip -Force
          $pthFile = Join-Path $runtime "python$pythonMinor._pth"
          if (-not (Test-Path -LiteralPath $pthFile)) { throw "Embedded Python path file is missing: $pthFile" }
          @("python$pythonMinor.zip", '.', '..', 'Lib\site-packages', 'import site') | Set-Content -LiteralPath $pthFile -Encoding ascii
          $sitePackages = Join-Path $runtime 'Lib\site-packages'
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          python -m pip install --disable-pip-version-check --no-compile --target $sitePackages -r requirements-portable.txt

          $portablePython = Join-Path $runtime 'python.exe'
          if (-not (Test-Path -LiteralPath $portablePython)) { throw 'The bundled Python executable is missing.' }
          Push-Location $package
          try {
            $env:PYTHONDONTWRITEBYTECODE = '1'
            & $portablePython -c 'import backend.main, backend.launcher_runtime, fastapi, uvicorn, sqlalchemy, PIL, reportlab, cryptography, argon2; from svglib.svglib import svg2rlg; print("Portable application imports successfully")'
            if ($LASTEXITCODE -ne 0) { throw 'The packaged Python runtime could not import the Workforce360 backend.' }
          }
          finally {
            Remove-Item Env:PYTHONDONTWRITEBYTECODE -ErrorAction SilentlyContinue
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath (Join-Path $package 'frontend\dist\index.html'))) { throw 'The production frontend build is missing.' }

          New-Item -ItemType Directory -Force -Path `
            (Join-Path $package 'data\uploads\workers'), `
            (Join-Path $package 'data\uploads\visitors'), `
            (Join-Path $package 'data\run\portable') | Out-Null
          @'
          ABB Workforce360 - Portable Windows Build

          1. Extract the complete ZIP into a writable folder.
          2. Double-click run_app.bat and keep its console open.
          3. Close the browser and press Enter in the console to stop this instance gracefully.

          The package includes its Python runtime, backend dependencies, and built React frontend. Python and Node.js are not needed on the user laptop.
          The backend tries port 8000 first and holds its bound socket while starting. If that port is busy, it reserves an available port and prints the actual URL.
          For other laptops on the same LAN, use the displayed address and allow inbound TCP for that port on Windows Firewall's Private profile if needed.
          The first launch creates .env with signing, worker ID, and encryption secrets. Do not share .env. Create the first administrator with:
            runtime\python.exe -m backend.create_admin
          Worker and visitor data live under data\. Logs, runtime state, and the portable launch lock live under data\run\portable\. Back up data\ and .env together.
          The release contains no database, uploaded user records, .env, source virtual environment, frontend node_modules, or development caches.
          '@ | Set-Content -LiteralPath (Join-Path $package 'PORTABLE_README.txt') -Encoding utf8

      - name: Run both project variants together
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360'
          $devPython = (Get-Command python.exe).Source
          $portablePython = Join-Path $package 'runtime\python.exe'
          & $devPython tests/launcher_integration_smoke.py `
            --source-root $PWD `
            --portable-root $package `
            --dev-python $devPython `
            --portable-python $portablePython
          if ($LASTEXITCODE -ne 0) { throw 'Development/portable simultaneous-launch smoke test failed.' }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360'
          $archive = Join-Path $env:RUNNER_TEMP 'ABB_Workforce360_Portable_Windows.zip'
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path $package -DestinationPath $archive -CompressionLevel Optimal

      - name: Attach portable ZIP to this Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ runner.temp }}/ABB_Workforce360_Portable_Windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
